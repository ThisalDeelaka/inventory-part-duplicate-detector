services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/inventory_detector.db
      MODEL_VERSION: hybrid-nlp-v1
      DEFAULT_THRESHOLD: "75"
      MAX_UPLOAD_BYTES: "52428800"
      MAX_CSV_RECORDS: "100000"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      CORS_ORIGIN_REGEX: http://(localhost|127\.0\.0\.1):\d+
    volumes: ["detector-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://127.0.0.1:8000"}
    ports: ["5173:80"]
    depends_on:
      backend: {condition: service_healthy}
  postgres-test-db:
    profiles:
      - postgres-test
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    restart: "no"
    environment:
      POSTGRES_DB: inventory_test
      POSTGRES_USER: inventory_test
      POSTGRES_PASSWORD: inventory_test_only
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio-test:
    profiles:
      - object-storage-test
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: inventory_test
      MINIO_ROOT_PASSWORD: inventory_test_only_2026
      MINIO_REGION_NAME: us-east-1
    ports:
      - "127.0.0.1:${MINIO_TEST_API_PORT:-59000}:9000"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9000/minio/health/live
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
volumes:
  detector-data:
