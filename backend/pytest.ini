[pytest]
addopts = -p no:cacheprovider
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
markers =
    postgres_integration: opt-in read-only test requiring the disposable PostgreSQL Compose service and POSTGRES_TEST_DATABASE_URL
    object_storage_integration: opt-in test requiring the disposable MinIO Compose service and explicit OBJECT_STORAGE_TEST_* settings
